server {
  listen 80;

  location /api/auth/ {
    proxy_pass http://cafe-auth-service:3000/auth/;
  }

  location /api/menu/ {
    # Mặc định nginx chặn body > 1MB, trong khi menu-api nhận ảnh tới 2MB.
    # Dư ra một chút cho phần đầu multipart.
    client_max_body_size 3m;
    proxy_pass http://cafe-menu-service:3000/menu/;
  }

  # WebSocket cần hai header này, nginx không tự chuyển tiếp chúng. Thiếu là
  # trình duyệt nhận 400 và socket không bao giờ mở. Khối này phải đứng riêng:
  # prefix dài hơn nên nginx chọn nó thay vì /api/orders bên dưới.
  location /api/orders/ws {
    proxy_pass http://cafe-order-service:3000/orders/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # order-api ping mỗi 30 giây, nên 1 giờ chỉ là lưới an toàn.
    proxy_read_timeout 1h;
  }

  location /api/orders {
    proxy_pass http://cafe-order-service:3000/orders;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
