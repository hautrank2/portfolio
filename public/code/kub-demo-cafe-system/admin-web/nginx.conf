server {
  listen 80;

  location /api/auth/ {
    proxy_pass http://cafe-auth-service:3000/auth/;
  }

  location /api/menu/ {
    proxy_pass http://cafe-menu-service:3000/menu/;
  }

  location /api/orders {
    proxy_pass http://cafe-order-service:3000/orders;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
