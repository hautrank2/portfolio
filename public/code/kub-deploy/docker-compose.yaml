version: "3"
services:
  auth:
    build: ./auth-api
    ports:
      - '8200:3000'
    environment:
      TOKEN_KEY: 'shouldbeverysecure'
  users:
    build: ./users-api
    ports:
      - '8201:3000'
    environment:
      MONGODB_CONNECTION_URI: 'mongodb+srv://<user>:<password>@<cluster>.mongodb.net/users?retryWrites=true&w=majority'
      AUTH_API_ADDRESS: 'auth:3000'