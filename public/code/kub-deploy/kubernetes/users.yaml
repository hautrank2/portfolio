apiVersion: v1
kind: Service
metadata:
  name: users-service
spec:
  selector:
    app: users
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8201
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users-api
          # Replace with your own Docker Hub account.
          # Bump the tag on every rebuild - never use :latest.
          image: <your-docker-user>/kub-dep-users:1
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGODB_CONNECTION_URI
              value: 'mongodb+srv://<user>:<password>@<cluster>.mongodb.net/users?retryWrites=true&w=majority'
            - name: AUTH_API_ADDRESS
              value: 'auth-service.default:3000'
