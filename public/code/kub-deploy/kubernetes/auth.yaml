apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth-api
          # Replace with your own Docker Hub account.
          # Bump the tag on every rebuild - never use :latest.
          image: <your-docker-user>/kub-dep-auth:1
          imagePullPolicy: IfNotPresent
          env:
            - name: TOKEN_KEY
              value: 'shouldbeverysecure'
