apiVersion: v1
kind: Service
metadata:
  name: shop-web-service
  annotations:
    # Bắt buộc trên cụm dùng AWS Load Balancer Controller hoặc EKS Auto Mode:
    # không khai thì nó dựng NLB internal, và bạn nhận ENOTFOUND khi gọi từ ngoài.
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  selector:
    app: shop-web
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8210
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-web-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-web
  template:
    metadata:
      labels:
        app: shop-web
    spec:
      containers:
        - name: shop-web
          image: <your-docker-user>/kub-cafe-shop:1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
